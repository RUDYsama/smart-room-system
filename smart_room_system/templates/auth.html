{% load static %}
<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารจัดการและจองสถานที่อัจฉริยะ</title>
    <link rel="icon" type="image/png" href="{% static 'images/void_hunter.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .auth-fade-in {
            opacity: 0;
            transform: translateY(16px);
            animation: fadeIn 0.5s ease-out forwards;
        }
        .section-fade {
            animation: fadeIn 0.35s ease-out forwards;
        }
        @keyframes avatarPeek {
            from {
                opacity: 0;
                transform: translate3d(50px, 50px, 0) rotate(0deg);
            }
            to {
                opacity: 1;
                transform: translate3d(6px, 6px, 0) rotate(-8deg);
            }
        }
        .avatar-peek-in {
            animation: avatarPeek 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }
        .parallelogram-container {
            position: relative;
        }
        .parallelogram-container::before {
            content: '';
            position: absolute;
            inset: 0;
            transform: skewX(-20deg);
            border-radius: 0.75rem;
            background-color: #f1f5f9;
            border: 1.5px solid #cbd5e1;
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
            z-index: 0;
        }
        .room-tab-skew {
            position: relative;
            background: transparent !important;
            border: none !important;
        }
        .room-tab-skew::before {
            content: '';
            position: absolute;
            inset: 0;
            transform: skewX(-20deg);
            border-radius: 0.5rem;
            transition: all 180ms ease;
            z-index: 0;
        }
        .room-tab-skew.tab-active::before {
            background-color: #2563eb;
            border: 1px solid #3b82f6;
            box-shadow: 0 4px 10px -1px rgba(37, 99, 235, 0.35);
        }
        .room-tab-skew.tab-inactive::before {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
        }
        .room-tab-skew.tab-inactive:hover::before {
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }
        .room-tab-content {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="h-full bg-slate-50 antialiased text-slate-800">
    <div class="min-h-screen flex flex-col lg:flex-row">
        <div class="relative hidden lg:block lg:w-[38%] xl:w-[36%] min-h-screen bg-slate-900 overflow-hidden">
            <img src="{% static 'images/Log_regis_img.jpg' %}" alt="Smart Room Reservation" class="w-full h-full object-cover object-[center_top] absolute inset-0">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/60 via-transparent to-slate-950/20 pointer-events-none"></div>
        </div>

        <div class="w-full lg:w-[62%] xl:w-[64%] flex flex-col justify-center px-6 sm:px-12 lg:px-16 py-10 min-h-screen bg-white">
            <div class="w-full max-w-md mx-auto auth-fade-in">
                
                <div class="flex items-center justify-between mb-8">
                    <a href="/" class="inline-flex items-center gap-2 text-slate-600 hover:text-blue-600 font-medium text-sm transition group">
                        <span class="group-hover:-translate-x-1 transition-transform">←</span>
                        <span>กลับหน้าหลัก</span>
                    </a>
                    <a href="/" class="inline-flex items-center">
                        <img src="{% static 'images/void_hunter_2x.png' %}" alt="Logo" class="h-9 w-9 object-contain">
                    </a>
                </div>

                <div id="modeSwitcherContainer" class="w-full mb-8">
                    <div class="parallelogram-container relative z-30 p-2 w-full">
                        <div id="modeSwitcher" class="relative z-10 flex items-center gap-3">
                            <button type="button" id="tabLoginBtn" onclick="switchMode('login')" class="room-nav-tab room-tab-skew tab-active flex-1 py-3 px-4 text-sm font-bold text-white flex items-center justify-center">
                                <div class="room-tab-content flex items-center justify-center gap-2">
                                    <svg id="loginTabSparkle" class="w-5 h-5 flex-shrink-0 text-white animate-pulse" viewBox="115 155 220 250" fill="currentColor">
                                        <path d="M 315.56 171.86 Q 255.98 249.48 309.75 300.14 Q 250.52 255.98 133.66 388.65 Q 244.02 250.52 190.25 199.86 Q 249.48 244.02 315.56 171.86 Z"/>
                                    </svg>
                                    <span>เข้าสู่ระบบ</span>
                                </div>
                            </button>
                            <button type="button" id="tabRegisterBtn" onclick="switchMode('register')" class="room-nav-tab room-tab-skew tab-inactive flex-1 py-3 px-4 text-sm font-semibold text-slate-800 hover:text-blue-600 flex items-center justify-center">
                                <div class="room-tab-content flex items-center justify-center gap-2">
                                    <svg id="regTabSparkle" class="w-5 h-5 flex-shrink-0 text-slate-400 group-hover:text-blue-500 hidden" viewBox="115 155 220 250" fill="currentColor">
                                        <path d="M 315.56 171.86 Q 255.98 249.48 309.75 300.14 Q 250.52 255.98 133.66 388.65 Q 244.02 250.52 190.25 199.86 Q 249.48 244.02 315.56 171.86 Z"/>
                                    </svg>
                                    <span>สมัครสมาชิก</span>
                                </div>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="loginSection" class="section-fade">
                    <div class="mb-6">
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">เข้าสู่ระบบ</h1>
                    </div>

                    <div id="loginErrorBanner" class="hidden mb-6 p-4 rounded-xl border border-rose-200 bg-rose-50 text-rose-700 text-sm flex items-start gap-3">
                        <svg class="w-5 h-5 flex-shrink-0 text-rose-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                        </svg>
                        <div id="loginErrorText" class="flex-1 break-words leading-relaxed"></div>
                    </div>

                    <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                        <div>
                            <label for="loginUsername" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">ชื่อผู้ใช้ หรือ อีเมล</label>
                            <input type="text" id="loginUsername" required autocomplete="username" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" placeholder="กรอกชื่อผู้ใช้ หรือ อีเมล">
                        </div>

                        <div>
                            <div class="flex items-center justify-between mb-1.5">
                                <label for="loginPassword" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">รหัสผ่าน</label>
                            </div>
                            <div class="relative">
                                <input type="password" id="loginPassword" required autocomplete="current-password" class="w-full pl-4 pr-11 py-3 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" placeholder="กรอกรหัสผ่าน">
                                <button type="button" onclick="togglePasswordVisibility('loginPassword', 'loginPasswordIcon')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                                    <svg id="loginPasswordIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="pt-2">
                            <button type="submit" id="loginSubmitBtn" class="w-full py-3.5 px-6 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm rounded-xl transition shadow-md shadow-blue-500/20 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 flex items-center justify-center gap-2">
                                <svg id="loginSpinner" class="hidden animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                <span id="loginBtnText">เข้าสู่ระบบ</span>
                            </button>
                        </div>
                    </form>

                    <div class="mt-8 text-center text-sm text-slate-500">
                        <span>ยังไม่มีบัญชีผู้ใช้?</span>
                        <button type="button" onclick="switchMode('register')" class="ml-1 text-blue-600 hover:text-blue-700 font-semibold focus:outline-none hover:underline">
                            สมัครสมาชิก
                        </button>
                    </div>
                </div>

                <div id="registerSection" class="hidden section-fade">
                    <div class="mb-6">
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">สมัครสมาชิก</h1>
                        <p class="text-slate-500 text-sm mt-1.5 leading-relaxed">สร้างบัญชีผู้ใช้ใหม่สำหรับระบบบริหารจัดการและจองสถานที่อัจฉริยะ</p>
                    </div>

                    <div id="regErrorBanner" class="hidden mb-6 p-4 rounded-xl border border-rose-200 bg-rose-50 text-rose-700 text-sm flex items-start gap-3">
                        <svg class="w-5 h-5 flex-shrink-0 text-rose-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                        </svg>
                        <div id="regErrorText" class="flex-1 break-words leading-relaxed"></div>
                    </div>

                    <form onsubmit="handleRegisterSubmit(event)" class="space-y-4">
                        <div>
                            <label for="regUsername" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">ชื่อผู้ใช้ (Username)</label>
                            <input type="text" id="regUsername" required autocomplete="username" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" placeholder="เช่น somchai_it">
                        </div>

                        <div>
                            <label for="regEmail" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">อีเมล (Email)</label>
                            <input type="email" id="regEmail" required autocomplete="email" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" placeholder="name@institution.ac.th">
                        </div>

                        <div>
                            <div class="flex items-center justify-between mb-1.5">
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">เบอร์โทรศัพท์</label>
                                <span class="text-[11px] text-slate-400 font-normal">10 หลัก</span>
                            </div>
                            <div class="flex items-center gap-1 sm:gap-1.5 justify-between w-full" id="phoneInputsContainer">
                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="phone-digit-box flex-1 min-w-0 h-11 sm:h-12 text-center text-base sm:text-lg font-bold font-mono text-slate-900 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" placeholder="0" data-idx="0">
                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="phone-digit-box flex-1 min-w-0 h-11 sm:h-12 text-center text-base sm:text-lg font-bold font-mono text-slate-900 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" placeholder="8" data-idx="1">
                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="phone-digit-box flex-1 min-w-0 h-11 sm:h-12 text-center text-base sm:text-lg font-bold font-mono text-slate-900 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm mr-1.5 sm:mr-2" placeholder="x" data-idx="2">

                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="phone-digit-box flex-1 min-w-0 h-11 sm:h-12 text-center text-base sm:text-lg font-bold font-mono text-slate-900 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" placeholder="x" data-idx="3">
                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="phone-digit-box flex-1 min-w-0 h-11 sm:h-12 text-center text-base sm:text-lg font-bold font-mono text-slate-900 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" placeholder="x" data-idx="4">
                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="phone-digit-box flex-1 min-w-0 h-11 sm:h-12 text-center text-base sm:text-lg font-bold font-mono text-slate-900 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm mr-1.5 sm:mr-2" placeholder="x" data-idx="5">

                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="phone-digit-box flex-1 min-w-0 h-11 sm:h-12 text-center text-base sm:text-lg font-bold font-mono text-slate-900 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" placeholder="x" data-idx="6">
                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="phone-digit-box flex-1 min-w-0 h-11 sm:h-12 text-center text-base sm:text-lg font-bold font-mono text-slate-900 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" placeholder="x" data-idx="7">
                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="phone-digit-box flex-1 min-w-0 h-11 sm:h-12 text-center text-base sm:text-lg font-bold font-mono text-slate-900 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" placeholder="x" data-idx="8">
                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="phone-digit-box flex-1 min-w-0 h-11 sm:h-12 text-center text-base sm:text-lg font-bold font-mono text-slate-900 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" placeholder="x" data-idx="9">
                            </div>
                            <input type="hidden" id="regPhone" name="phone">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label for="regPassword" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">รหัสผ่าน</label>
                                <div class="relative">
                                    <input type="password" id="regPassword" required autocomplete="new-password" minlength="8" class="w-full pl-4 pr-10 py-3 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" placeholder="อย่างน้อย 8 ตัวอักษร">
                                    <button type="button" onclick="togglePasswordVisibility('regPassword', 'regPasswordIcon')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                                        <svg id="regPasswordIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div>
                                <label for="regPasswordConfirm" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">ยืนยันรหัสผ่าน</label>
                                <div class="relative">
                                    <input type="password" id="regPasswordConfirm" required autocomplete="new-password" minlength="8" class="w-full pl-4 pr-10 py-3 bg-white border border-slate-300 rounded-xl text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-600 transition shadow-sm" placeholder="กรอกรหัสผ่านซ้ำอีกครั้ง">
                                    <button type="button" onclick="togglePasswordVisibility('regPasswordConfirm', 'regPasswordConfirmIcon')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                                        <svg id="regPasswordConfirmIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="pt-2">
                            <button type="submit" id="regSubmitBtn" class="w-full py-3.5 px-6 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm rounded-xl transition shadow-md shadow-blue-500/20 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 flex items-center justify-center gap-2">
                                <svg id="regSpinner" class="hidden animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                <span id="regBtnText">สมัครสมาชิก</span>
                            </button>
                        </div>
                    </form>

                    <div class="mt-8 text-center text-sm text-slate-500">
                        <span>มีบัญชีอยู่แล้ว?</span>
                        <button type="button" onclick="switchMode('login')" class="ml-1 text-blue-600 hover:text-blue-700 font-semibold focus:outline-none hover:underline">
                            เข้าสู่ระบบ
                        </button>
                    </div>
                </div>

                <div id="otpSection" class="hidden section-fade">
                    <div class="mb-6 text-center">
                        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-50 text-blue-600 border border-blue-100 mb-4 shadow-sm">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                            </svg>
                        </div>
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">ยืนยันรหัสความปลอดภัย PIN</h1>
                        <p class="text-slate-500 text-sm mt-2 leading-relaxed">กรุณากรอกรหัส PIN 6 หลักที่ระบบส่งไปยังอีเมลของคุณ</p>
                        <p id="otpEmailDisplay" class="text-blue-600 font-semibold text-sm mt-1"></p>
                    </div>

                    <div id="otpErrorBanner" class="hidden mb-6 p-4 rounded-xl border border-rose-200 bg-rose-50 text-rose-700 text-sm flex items-start gap-3">
                        <svg class="w-5 h-5 flex-shrink-0 text-rose-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                        </svg>
                        <div id="otpErrorText" class="flex-1 break-words leading-relaxed"></div>
                    </div>

                    <div id="otpSuccessBanner" class="hidden mb-6 p-4 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-700 text-sm flex items-start gap-3">
                        <svg class="w-5 h-5 flex-shrink-0 text-emerald-600 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                        <div id="otpSuccessText" class="flex-1 break-words leading-relaxed"></div>
                    </div>

                    <form onsubmit="handleVerifyOtp(event)" class="space-y-5">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-3 text-center">รหัสความปลอดภัย PIN 6 หลัก</label>
                            <div class="flex items-center justify-center gap-2 sm:gap-3 w-full max-w-sm mx-auto" id="otpDigitsContainer">
                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" autocomplete="one-time-code" class="otp-digit-box flex-1 min-w-0 max-w-[54px] h-13 sm:h-14 text-center text-xl sm:text-2xl font-bold font-mono text-slate-900 bg-white border-2 border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 transition shadow-sm" placeholder="•" data-idx="0">
                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="otp-digit-box flex-1 min-w-0 max-w-[54px] h-13 sm:h-14 text-center text-xl sm:text-2xl font-bold font-mono text-slate-900 bg-white border-2 border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 transition shadow-sm" placeholder="•" data-idx="1">
                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="otp-digit-box flex-1 min-w-0 max-w-[54px] h-13 sm:h-14 text-center text-xl sm:text-2xl font-bold font-mono text-slate-900 bg-white border-2 border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 transition shadow-sm" placeholder="•" data-idx="2">
                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="otp-digit-box flex-1 min-w-0 max-w-[54px] h-13 sm:h-14 text-center text-xl sm:text-2xl font-bold font-mono text-slate-900 bg-white border-2 border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 transition shadow-sm" placeholder="•" data-idx="3">
                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="otp-digit-box flex-1 min-w-0 max-w-[54px] h-13 sm:h-14 text-center text-xl sm:text-2xl font-bold font-mono text-slate-900 bg-white border-2 border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 transition shadow-sm" placeholder="•" data-idx="4">
                                <input type="text" inputmode="numeric" maxlength="1" pattern="[0-9]*" class="otp-digit-box flex-1 min-w-0 max-w-[54px] h-13 sm:h-14 text-center text-xl sm:text-2xl font-bold font-mono text-slate-900 bg-white border-2 border-slate-300 rounded-xl focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 transition shadow-sm" placeholder="•" data-idx="5">
                            </div>
                            <input type="hidden" id="otpCode" name="otp_code">
                        </div>

                        <div>
                            <button type="submit" id="otpSubmitBtn" class="w-full py-3.5 px-6 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm rounded-xl transition shadow-md shadow-blue-500/20 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 flex items-center justify-center gap-2">
                                <svg id="otpSpinner" class="hidden animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                                <span id="otpBtnText">ยืนยันรหัส PIN และเข้าสู่ระบบ</span>
                            </button>
                        </div>

                        <div class="pt-2 text-center">
                            <button type="button" id="resendOtpBtn" onclick="handleResendOtp()" class="text-sm font-semibold text-slate-600 hover:text-blue-600 focus:outline-none transition">
                                ยังไม่ได้รับรหัส? ขอรหัส PIN ใหม่
                            </button>
                        </div>
                    </form>

                    <div class="mt-8 text-center text-sm text-slate-500">
                        <button type="button" onclick="switchMode('login')" class="text-slate-500 hover:text-slate-800 font-medium focus:outline-none">
                            กลับไปหน้าเข้าสู่ระบบ
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        let currentEmail = '';
        let resendCooldown = 0;
        let cooldownTimer = null;

        function setAlert(bannerId, textId, message) {
            const banner = document.getElementById(bannerId);
            const textEl = document.getElementById(textId);
            if (!banner || !textEl) return;
            if (message) {
                textEl.textContent = message;
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
                textEl.textContent = '';
            }
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input || !icon) return;
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
            }
        }

        function switchMode(mode, updateUrl = true) {
            const loginSection = document.getElementById('loginSection');
            const registerSection = document.getElementById('registerSection');
            const otpSection = document.getElementById('otpSection');
            const modeSwitcherContainer = document.getElementById('modeSwitcherContainer');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');
            const loginSparkle = document.getElementById('loginTabSparkle');
            const regSparkle = document.getElementById('regTabSparkle');

            setAlert('loginErrorBanner', 'loginErrorText', '');
            setAlert('regErrorBanner', 'regErrorText', '');
            setAlert('otpErrorBanner', 'otpErrorText', '');
            setAlert('otpSuccessBanner', 'otpSuccessText', '');

            if (mode === 'register') {
                if (updateUrl) {
                    history.replaceState(null, '', '?mode=register');
                }
                if (modeSwitcherContainer) modeSwitcherContainer.classList.remove('hidden');
                tabLoginBtn.className = 'room-nav-tab room-tab-skew tab-inactive flex-1 py-3 px-4 text-sm font-semibold text-slate-800 hover:text-blue-600 flex items-center justify-center';
                tabRegisterBtn.className = 'room-nav-tab room-tab-skew tab-active flex-1 py-3 px-4 text-sm font-bold text-white flex items-center justify-center';
                if (loginSparkle) loginSparkle.classList.add('hidden');
                if (regSparkle) {
                    regSparkle.classList.remove('hidden');
                    regSparkle.setAttribute('class', 'w-5 h-5 flex-shrink-0 text-white animate-pulse');
                }
                loginSection.classList.add('hidden');
                otpSection.classList.add('hidden');
                registerSection.classList.remove('hidden');
                registerSection.classList.remove('section-fade');
                void registerSection.offsetWidth;
                registerSection.classList.add('section-fade');
            } else if (mode === 'otp') {
                if (modeSwitcherContainer) modeSwitcherContainer.classList.add('hidden');
                loginSection.classList.add('hidden');
                registerSection.classList.add('hidden');
                otpSection.classList.remove('hidden');
                otpSection.classList.remove('section-fade');
                void otpSection.offsetWidth;
                otpSection.classList.add('section-fade');
                setTimeout(() => {
                    const firstOtpBox = document.querySelector('.otp-digit-box');
                    if (firstOtpBox) firstOtpBox.focus();
                }, 100);
            } else {
                if (updateUrl) {
                    history.replaceState(null, '', '?mode=login');
                }
                if (modeSwitcherContainer) modeSwitcherContainer.classList.remove('hidden');
                tabLoginBtn.className = 'room-nav-tab room-tab-skew tab-active flex-1 py-3 px-4 text-sm font-bold text-white flex items-center justify-center';
                tabRegisterBtn.className = 'room-nav-tab room-tab-skew tab-inactive flex-1 py-3 px-4 text-sm font-semibold text-slate-800 hover:text-blue-600 flex items-center justify-center';
                if (loginSparkle) {
                    loginSparkle.classList.remove('hidden');
                    loginSparkle.setAttribute('class', 'w-5 h-5 flex-shrink-0 text-white animate-pulse');
                }
                if (regSparkle) regSparkle.classList.add('hidden');
                registerSection.classList.add('hidden');
                otpSection.classList.add('hidden');
                loginSection.classList.remove('hidden');
                loginSection.classList.remove('section-fade');
                void loginSection.offsetWidth;
                loginSection.classList.add('section-fade');
            }
        }

        async function handleLoginSubmit(event) {
            event.preventDefault();
            setAlert('loginErrorBanner', 'loginErrorText', '');

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            const submitBtn = document.getElementById('loginSubmitBtn');
            const spinner = document.getElementById('loginSpinner');
            const btnText = document.getElementById('loginBtnText');

            submitBtn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = 'กำลังตรวจสอบข้อมูล...';

            try {
                const response = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.access) {
                    localStorage.setItem('access_token', data.access);
                    localStorage.setItem('refresh_token', data.refresh);
                    localStorage.setItem('smart_room_token', data.access);
                    if (data.refresh) {
                        localStorage.setItem('smart_room_refresh', data.refresh);
                    }
                    localStorage.setItem('smart_room_last_activity', Date.now().toString());

                    let userDetails = { username: username };
                    try {
                        const profileRes = await fetch('/api/auth/profile/', {
                            headers: {
                                'Authorization': 'Bearer ' + data.access
                            }
                        });
                        if (profileRes.ok) {
                            userDetails = await profileRes.json();
                        }
                    } catch (e) {}

                    localStorage.setItem('user', JSON.stringify(userDetails));
                    localStorage.setItem('currentUser', JSON.stringify(userDetails));

                    const urlParams = new URLSearchParams(window.location.search);
                    const nextUrl = urlParams.get('next');
                    const targetUrl = nextUrl || data.redirect_url || (userDetails.role === 'admin' ? '/admin-panel/' : '/user/');
                    window.location.href = targetUrl;
                } else {
                    let errMsg = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
                    if (data.detail) {
                        errMsg = data.detail;
                    } else if (typeof data === 'object') {
                        const extracted = [];
                        for (const key in data) {
                            const val = Array.isArray(data[key]) ? data[key].join(' ') : data[key];
                            extracted.push(val);
                        }
                        if (extracted.length > 0) errMsg = extracted.join(' ');
                    }
                    setAlert('loginErrorBanner', 'loginErrorText', errMsg);
                }
            } catch (error) {
                setAlert('loginErrorBanner', 'loginErrorText', 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง');
            } finally {
                submitBtn.disabled = false;
                spinner.classList.add('hidden');
                btnText.textContent = 'เข้าสู่ระบบ';
            }
        }

        async function handleRegisterSubmit(event) {
            event.preventDefault();
            setAlert('regErrorBanner', 'regErrorText', '');

            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone') ? document.getElementById('regPhone').value.trim() : '';
            const department = document.getElementById('regDepartment') ? document.getElementById('regDepartment').value.trim() : '';
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;

            if (password !== passwordConfirm) {
                setAlert('regErrorBanner', 'regErrorText', 'รหัสผ่านและยืนยันรหัสผ่านไม่ตรงกัน');
                return;
            }

            if (password.length < 8) {
                setAlert('regErrorBanner', 'regErrorText', 'รหัสผ่านต้องมีความยาวอย่างน้อย 8 ตัวอักษร');
                return;
            }

            if (phone.length > 0 && phone.length < 10) {
                setAlert('regErrorBanner', 'regErrorText', 'กรุณากรอกเบอร์โทรศัพท์ให้ครบทั้ง 10 หลัก');
                return;
            }

            const submitBtn = document.getElementById('regSubmitBtn');
            const spinner = document.getElementById('regSpinner');
            const btnText = document.getElementById('regBtnText');

            submitBtn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = 'กำลังส่งข้อมูล...';

            try {
                const response = await fetch('/api/auth/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        phone_number: phone,
                        department: department,
                        password: password,
                        password_confirm: passwordConfirm
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    currentEmail = email;
                    document.getElementById('otpEmailDisplay').textContent = email;
                    switchMode('otp', false);
                    if (data.dev_pin) {
                        const hint = 'รหัสยืนยัน PIN 6 หลัก: ' + data.dev_pin + ' (ระบบได้ส่งไปยัง ' + email + ' แล้ว)';
                        setAlert('otpSuccessBanner', 'otpSuccessText', hint);
                        const boxes = Array.from(document.querySelectorAll('.otp-digit-box'));
                        const pinChars = String(data.dev_pin).split('');
                        boxes.forEach((b, i) => { if (pinChars[i]) b.value = pinChars[i]; });
                        const hiddenOtp = document.getElementById('otpCode');
                        if (hiddenOtp) hiddenOtp.value = data.dev_pin;
                    }
                } else {
                    let errMsg = 'เกิดข้อผิดพลาดในการลงทะเบียน';
                    if (typeof data === 'object') {
                        const extracted = [];
                        for (const key in data) {
                            const val = Array.isArray(data[key]) ? data[key].join(' ') : data[key];
                            extracted.push(key + ': ' + val);
                        }
                        if (extracted.length > 0) errMsg = extracted.join(' | ');
                    }
                    setAlert('regErrorBanner', 'regErrorText', errMsg);
                }
            } catch (error) {
                setAlert('regErrorBanner', 'regErrorText', 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง');
            } finally {
                submitBtn.disabled = false;
                spinner.classList.add('hidden');
                btnText.textContent = 'สมัครสมาชิก';
            }
        }

        async function handleVerifyOtp(event) {
            if (event) event.preventDefault();
            setAlert('otpErrorBanner', 'otpErrorText', '');
            setAlert('otpSuccessBanner', 'otpSuccessText', '');

            const otpCode = document.getElementById('otpCode').value.trim();

            if (!otpCode || otpCode.length !== 6) {
                setAlert('otpErrorBanner', 'otpErrorText', 'กรุณากรอกรหัส PIN ให้ครบถ้วน 6 หลัก');
                return;
            }

            const submitBtn = document.getElementById('otpSubmitBtn');
            const spinner = document.getElementById('otpSpinner');
            const btnText = document.getElementById('otpBtnText');

            submitBtn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.textContent = 'กำลังยืนยันรหัส PIN...';

            try {
                const response = await fetch('/api/auth/verify-otp/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: currentEmail,
                        otp_code: otpCode
                    })
                });

                const data = await response.json();

                if (response.ok && (data.access || data.token)) {
                    const accessToken = data.access || data.token;
                    const refreshToken = data.refresh || '';

                    localStorage.setItem('access_token', accessToken);
                    localStorage.setItem('refresh_token', refreshToken);
                    localStorage.setItem('smart_room_token', accessToken);
                    if (refreshToken) {
                        localStorage.setItem('smart_room_refresh', refreshToken);
                    }
                    localStorage.setItem('smart_room_last_activity', Date.now().toString());

                    if (data.user) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                        localStorage.setItem('currentUser', JSON.stringify(data.user));
                    }

                    window.location.href = '/';
                } else {
                    const errMsg = data.error || data.detail || 'รหัส PIN ไม่ถูกต้องหรือหมดอายุการใช้งานแล้ว';
                    setAlert('otpErrorBanner', 'otpErrorText', errMsg);
                }
            } catch (error) {
                setAlert('otpErrorBanner', 'otpErrorText', 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง');
            } finally {
                submitBtn.disabled = false;
                spinner.classList.add('hidden');
                btnText.textContent = 'ยืนยันรหัส PIN และเข้าสู่ระบบ';
            }
        }

        async function handleResendOtp() {
            if (resendCooldown > 0) return;
            setAlert('otpErrorBanner', 'otpErrorText', '');
            setAlert('otpSuccessBanner', 'otpSuccessText', '');

            if (!currentEmail) {
                setAlert('otpErrorBanner', 'otpErrorText', 'ไม่พบข้อมูลอีเมลสำหรับการส่งรหัส กรุณาสมัครสมาชิกใหม่อีกครั้ง');
                return;
            }

            const resendBtn = document.getElementById('resendOtpBtn');
            resendBtn.disabled = true;
            resendBtn.textContent = 'กำลังส่งรหัส PIN ชุดใหม่...';

            try {
                const response = await fetch('/api/auth/resend-otp/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: currentEmail
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    const msg = data.dev_pin ? 
                        ('รหัส PIN ใหม่ของคุณคือ: ' + data.dev_pin + ' (ส่งข้อมูลไปยัง ' + currentEmail + ' แล้ว)') : 
                        'ระบบได้ส่งรหัส PIN ชุดใหม่ไปยังอีเมลของคุณเรียบร้อยแล้ว';
                    setAlert('otpSuccessBanner', 'otpSuccessText', msg);
                    if (data.dev_pin) {
                        const boxes = Array.from(document.querySelectorAll('.otp-digit-box'));
                        const pinChars = String(data.dev_pin).split('');
                        boxes.forEach((b, i) => { if (pinChars[i]) b.value = pinChars[i]; });
                        const hiddenOtp = document.getElementById('otpCode');
                        if (hiddenOtp) hiddenOtp.value = data.dev_pin;
                    }
                    resendCooldown = 60;
                    updateCooldownUI();
                    cooldownTimer = setInterval(() => {
                        resendCooldown--;
                        if (resendCooldown <= 0) {
                            clearInterval(cooldownTimer);
                            resendBtn.disabled = false;
                            resendBtn.textContent = 'ยังไม่ได้รับรหัส? ขอรหัส PIN ใหม่';
                        } else {
                            updateCooldownUI();
                        }
                    }, 1000);
                } else {
                    const errMsg = data.error || data.detail || 'ไม่สามารถส่งรหัส PIN ได้ กรุณาลองใหม่อีกครั้งในภายหลัง';
                    setAlert('otpErrorBanner', 'otpErrorText', errMsg);
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'ยังไม่ได้รับรหัส? ขอรหัส PIN ใหม่';
                }
            } catch (error) {
                setAlert('otpErrorBanner', 'otpErrorText', 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
                resendBtn.disabled = false;
                resendBtn.textContent = 'ยังไม่ได้รับรหัส? ขอรหัส PIN ใหม่';
            }
        }

        function updateCooldownUI() {
            const resendBtn = document.getElementById('resendOtpBtn');
            if (resendBtn) {
                resendBtn.textContent = 'ส่งรหัสใหม่ได้อีกครั้งใน ' + resendCooldown + ' วินาที';
            }
        }

        function initPhoneDigitInputs() {
            const boxes = Array.from(document.querySelectorAll('.phone-digit-box'));
            const hiddenPhone = document.getElementById('regPhone');
            if (!boxes.length || !hiddenPhone) return;

            function syncPhone() {
                hiddenPhone.value = boxes.map(b => b.value).join('');
            }

            boxes.forEach((box, idx) => {
                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace') {
                        if (box.value === '' && idx > 0) {
                            e.preventDefault();
                            boxes[idx - 1].focus();
                            boxes[idx - 1].value = '';
                            syncPhone();
                        }
                    } else if (e.key === 'ArrowLeft' && idx > 0) {
                        e.preventDefault();
                        boxes[idx - 1].focus();
                    } else if (e.key === 'ArrowRight' && idx < boxes.length - 1) {
                        e.preventDefault();
                        boxes[idx + 1].focus();
                    }
                });

                box.addEventListener('input', () => {
                    const clean = box.value.replace(/\D/g, '');
                    box.value = clean ? clean[0] : '';
                    syncPhone();
                    if (box.value && idx < boxes.length - 1) {
                        boxes[idx + 1].focus();
                    }
                });

                box.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasteData = (e.clipboardData || window.clipboardData).getData('text') || '';
                    const digits = pasteData.replace(/\D/g, '').slice(0, boxes.length);
                    if (!digits) return;
                    for (let i = 0; i < boxes.length; i++) {
                        boxes[i].value = digits[i] || '';
                    }
                    syncPhone();
                    const nextFocusIdx = Math.min(digits.length, boxes.length - 1);
                    boxes[nextFocusIdx].focus();
                });

                box.addEventListener('focus', () => {
                    box.select();
                });
            });
        }

        function initOtpDigitInputs() {
            const boxes = Array.from(document.querySelectorAll('.otp-digit-box'));
            const hiddenOtp = document.getElementById('otpCode');
            if (!boxes.length || !hiddenOtp) return;

            function syncOtp() {
                hiddenOtp.value = boxes.map(b => b.value).join('');
            }

            boxes.forEach((box, idx) => {
                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace') {
                        if (box.value === '' && idx > 0) {
                            e.preventDefault();
                            boxes[idx - 1].focus();
                            boxes[idx - 1].value = '';
                            syncOtp();
                        }
                    } else if (e.key === 'ArrowLeft' && idx > 0) {
                        e.preventDefault();
                        boxes[idx - 1].focus();
                    } else if (e.key === 'ArrowRight' && idx < boxes.length - 1) {
                        e.preventDefault();
                        boxes[idx + 1].focus();
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        handleVerifyOtp(e);
                    }
                });

                box.addEventListener('input', () => {
                    const clean = box.value.replace(/\D/g, '');
                    box.value = clean ? clean[0] : '';
                    syncOtp();
                    if (box.value && idx < boxes.length - 1) {
                        boxes[idx + 1].focus();
                    }
                });

                box.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasteData = (e.clipboardData || window.clipboardData).getData('text') || '';
                    const digits = pasteData.replace(/\D/g, '').slice(0, boxes.length);
                    if (!digits) return;
                    for (let i = 0; i < boxes.length; i++) {
                        boxes[i].value = digits[i] || '';
                    }
                    syncOtp();
                    const nextFocusIdx = Math.min(digits.length, boxes.length - 1);
                    boxes[nextFocusIdx].focus();
                });

                box.addEventListener('focus', () => {
                    box.select();
                });
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initPhoneDigitInputs();
            initOtpDigitInputs();
            const urlParams = new URLSearchParams(window.location.search);
            const modeParam = urlParams.get('mode');
            if (modeParam === 'register') {
                switchMode('register', false);
            } else {
                switchMode('login', false);
            }
        });
    </script>

    <div id="authHandsomeAvatar" class="avatar-peek-in fixed right-0 bottom-0 pointer-events-none z-20 hidden md:block select-none origin-bottom-right">
        <img src="{% static 'images/avatar_thumbs_up.png' %}" alt="Avatar" class="w-36 sm:w-44 lg:w-52 xl:w-60 h-auto object-contain filter drop-shadow-[0_20px_35px_rgba(0,0,0,0.35)] select-none">
    </div>
</body>
